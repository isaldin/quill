name: Quill
options:
  bundleIdPrefix: dev.saldin
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: CQA364G4K8
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: NO
    MARKETING_VERSION: "0.1.3"
    CURRENT_PROJECT_VERSION: "4"
packages:
  QuillCore:
    path: Core
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 3.1.0
targets:
  Quill:
    type: application
    platform: macOS
    sources: [App/Sources, App/Resources]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Quill
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        NSMicrophoneUsageDescription: "Quill записывает голос для диктовки."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.saldin.quill
        PRODUCT_NAME: Quill
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: QuillCore
      - package: KeyboardShortcuts
    scheme: {}
